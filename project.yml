name: threemf
options:
  bundleIdPrefix: com.andreymaltsev
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: DDZR8BZJYU
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"

targets:
  ThreeMFQuickLook:
    type: application
    platform: macOS
    sources:
      - Sources/HostApp
      - Sources/Shared
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook
        INFOPLIST_FILE: Sources/HostApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/HostApp/HostApp.entitlements
        PRODUCT_NAME: threemf
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - script: |
          GIT_HASH=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GIT_DIRTY=$(git -C "$SRCROOT" diff --quiet 2>/dev/null && echo "" || echo "+")
          cat > "$SRCROOT/Sources/HostApp/BuildInfo.generated.swift" << SWIFT
          // Auto-generated by build phase — do not edit
          /// Build metadata embedded at compile time.
          enum BuildInfo {
              static let gitHash = "${GIT_HASH}${GIT_DIRTY}"
          }
          SWIFT
        name: Generate BuildInfo
        outputFiles:
          - $(SRCROOT)/Sources/HostApp/BuildInfo.generated.swift
    dependencies:
      - target: ThreeMFPreviewExtension
      - target: ThreeMFThumbnailExtension
      - target: ThreeMFFinderSync
      - target: ThreeMFMDImporter
        embed: false
      - package: ZIPFoundation
      - sdk: AppIntents.framework
      - sdk: SceneKit.framework
    postBuildScripts:
      - script: |
          set -e
          DEST="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/Contents/Library/Spotlight"
          mkdir -p "$DEST"
          ditto "$BUILT_PRODUCTS_DIR/ThreeMFMDImporter.mdimporter" "$DEST/ThreeMFMDImporter.mdimporter"
        name: Embed Spotlight Importer
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ThreeMFMDImporter.mdimporter
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Library/Spotlight/ThreeMFMDImporter.mdimporter

  ThreeMFPreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/PreviewExtension
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook.preview
        INFOPLIST_FILE: Sources/PreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PreviewExtension/PreviewExtension.entitlements
        PRODUCT_NAME: ThreeMFPreviewExtension
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - package: ZIPFoundation
      - framework: QuickLookUI.framework
        embed: false
      - sdk: Quartz.framework
      - sdk: SceneKit.framework

  ThreeMFThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/ThumbnailExtension
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook.thumbnail
        INFOPLIST_FILE: Sources/ThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ThumbnailExtension/ThumbnailExtension.entitlements
        PRODUCT_NAME: ThreeMFThumbnailExtension
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - package: ZIPFoundation
      - sdk: QuickLookThumbnailing.framework
      - sdk: SceneKit.framework

  ThreeMFFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - Sources/FinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook.findersync
        INFOPLIST_FILE: Sources/FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FinderSync/FinderSync.entitlements
        PRODUCT_NAME: ThreeMFFinderSync
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - sdk: FinderSync.framework
      - sdk: AppKit.framework

  ThreeMFMDImporter:
    type: bundle
    platform: macOS
    productType: com.apple.product-type.spotlight-importer
    sources:
      - Sources/MDImporter
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook.mdimporter
        INFOPLIST_FILE: Sources/MDImporter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MDImporter/MDImporter.entitlements
        PRODUCT_NAME: ThreeMFMDImporter
        WRAPPER_EXTENSION: mdimporter
        ENABLE_APP_SANDBOX: YES
        # mdimporters never call out to the network or run a UI; they execute inside mdworker.
        SKIP_INSTALL: YES
    dependencies:
      - package: ZIPFoundation
      - sdk: CoreFoundation.framework
      - sdk: CoreServices.framework

  threemf-cli:
    type: tool
    platform: macOS
    sources:
      - Sources/CLI
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.threemf-cli
        PRODUCT_NAME: threemf-cli
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ZIPFoundation
      - sdk: SceneKit.framework
      - sdk: AppKit.framework

  ThreeMFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreymaltsev.3mf-quicklook.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: ZIPFoundation
      - sdk: SceneKit.framework
